# Render Blueprint: New > Blueprint > pick this repo. Deploys one web service.
services:
  - type: web
    name: zeroasphyx
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MQTT_PREFIX
        value: ZeroAsphyx # must equal PREFIX in firmware/sketch.ino
      # PUBLIC_URL is optional on Render: RENDER_EXTERNAL_URL is used for QR codes automatically.
